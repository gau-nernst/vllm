# Accuracy A/B: fused mHC down+SiLU (qwen4exp-hc-down-silu) vs main.
# Adapted from ~/inferact-skills/vigil/configs/qwen38next/qwen_air_accuracy.yaml.
# MTP3 + gsm8k/mmmu_pro per the team's standard accuracy setup for this model;
# spec-decode also exercises the fused kernel's M<=48 gate with variable M.
model: Qwen/Qwen3.8-Flash-Next
mode: remote
precheck: true
collect_env: true
mqa_repo_path: /home/${USER}/mqa

pre_serve:
  - cmd:
      cmd: curl -sf http://localhost:9400/metrics
      remote: true

sweep:
  branch:
    - main
    - qwen4exp-hc-down-silu
  parallel_size: 1
  fail_fast: false

serving:
  roles:
    - role: worker
      count: 1
      nodes_per_instance: 1
      gpus_per_node: 4
      base_port: 8000
      vllm_engine:
        cmd: |
          vllm serve {model}
          --port {port}
          -tp 4
          --enable-prefix-caching
          --no-enable-flashinfer-autotune
          --enable-auto-tool-choice
          --tool-call-parser qwen3_coder
          --reasoning-parser qwen3
          --speculative-config '{"method": "mtp", "num_speculative_tokens": 3}'
        repo_path: /home/${USER}/vllm/{branch}
        env:
          TMPDIR: /tmp/${USER}
          HF_HUB_OFFLINE: "1"
          VLLM_ENGINE_READY_TIMEOUT_S: "3600"
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
          VLLM_USE_V2_MODEL_RUNNER: "1"
          VLLM_ALLREDUCE_USE_FLASHINFER: "1"
          FLASHINFER_WORKSPACE_BASE: /home/${USER}/vllm/{branch}
        health_check:
          url: http://localhost:{port}/health
          timeout_s: 3600
          poll_interval_s: 5
        stop_timeout_s: 120

  remote:
    launcher: slurm
    slurm:
      partition: rack4
      time_limit: "10:00:00"
      gpus_per_node: 4
      # no nodelist pin: pod4-gb300-4-tray18-f3 has a sticky XID 43 on GPU0.

post_serve:
  - mqa:
      repo_path: "{mqa_repo_path}"
      base_url: http://{head_addr}:8000
      env:
        HF_HUB_CACHE: /mnt/ceph/hf-models/hub
        HF_DATASETS_CACHE: /home/${USER}/.cache/huggingface/datasets
      timeout_s: 60000
      output_dir: "{log_dir}/mqa"
      save_interactions: true
      tasks:
        - task: gsm8k
          api_type: chat_completions
          max_tokens: 1024
          concurrency: 32
          epoch_num: 2
          shot_num: 5
          temperature: 0
          think: false

        - task: mmmu_pro
          api_type: chat_completions
          max_tokens: 65536
          concurrency: 64
          timeout_s: 6000
          think: true
